name: Build and publish image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # Lowercase and hardcoded rather than ${{ github.repository }}: GHCR
          # rejects uppercase in an image path, and the repo name carries
          # capitals. A package name doesn't have to match its repo, so this
          # stays correct however the repo is capitalised or renamed again.
          tags: ghcr.io/mylesfairburn/fpl-buddy:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max