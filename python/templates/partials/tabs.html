        {# Real anchors, not buttons. Each tab is a genuine URL now, and a
           crawler can only find a page it can follow a link to - a <button>
           with a click handler is invisible to it. app.js intercepts the click
           so switching tabs stays instant and no page is reloaded; middle-click,
           ctrl-click and "open in new tab" all still do the right thing because
           the href is really there.

           The active tab is marked server-side as well as by app.js. Leaving it
           to the script alone means the page paints with no tab highlighted and
           snaps into place a moment later.

           `tabs` comes from main.py, which owns the routing table - the labels
           and hrefs aren't repeated here so they can't drift out of step with
           the routes that serve them. #}
        <ul class="nav nav-tabs mb-4" id="mainTabs">
{% for t in tabs %}
            <li class="nav-item"><a class="nav-link{{ ' active' if initial_pane == t.pane }}"
                href="{{ t.path }}" data-pane="{{ t.pane }}" data-title="{{ t.title }}"
                data-h1="{{ t.h1 }}">{{ t.label }}</a></li>
{% endfor %}
{# The reading pages, in the same bar but not of it. They're <li>s inside the
   same <ul> rather than a separate row so the tab bar's underline still runs
   the full width and the two sets sit on one baseline.

   `content-link-first` carries margin-left:auto, which is what pushes them to
   the far right - and only when there are tool tabs to push away from, since
   the home page includes this partial with an empty `tabs` and these should
   start at the left there instead of floating on an empty bar.

   These are ordinary links with no data-pane: app.js only intercepts clicks on
   tabs that name a pane, so these navigate normally, as they must - they are
   real pages, not panes of this one. #}
{% for c in content_links %}
            <li class="nav-item content-link{{ ' content-link-first' if loop.first and tabs }}">
                <a class="nav-link{{ ' active' if c.active }}" href="{{ c.path }}"
                   {% if c.active %}aria-current="page"{% endif %}
                   aria-label="{{ c.label }}"><span class="cl-full">{{ c.label }}</span><span
                   class="cl-short">{{ c.short }}</span></a></li>
{% endfor %}
        </ul>
