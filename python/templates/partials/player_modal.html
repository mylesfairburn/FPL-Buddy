    <!-- Player pop-up -->
    <!-- role/aria-modal so assistive technology treats this as a dialog rather
         than as another div; aria-labelledby points at the name, which is what
         gets announced when focus lands inside. -->
    <div id="playerModal" class="player-modal d-none" role="dialog"
         aria-modal="true" aria-labelledby="pmName">
        <div class="pm-backdrop" id="pmBackdrop"></div>
        <div class="pm-card">
            <button class="pm-close" id="pmClose" type="button" aria-label="Close">&times;</button>
            <div class="pm-head">
                <span id="pmKit"></span>
                <div><div class="pm-name" id="pmName"></div><div class="pm-sub" id="pmSub"></div></div>
            </div>
            <div class="pm-actions" id="pmActions"></div>
            <div id="pmTransfer" class="pm-transfer d-none"></div>
            <div class="pm-section-label">Upcoming fixtures</div>
            <div id="pmUpcoming" class="pm-fixtures"></div>
            <div class="pm-section-label">Recent form</div>
            <div id="pmForm"></div>
            <a id="pmProfile" class="pm-profile d-none" href="#">Full profile &rsaquo;</a>
        </div>
    </div>
