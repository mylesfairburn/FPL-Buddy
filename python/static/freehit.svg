<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Free Hit">
  <title>Free Hit</title>
  <rect width="64" height="64" rx="14" fill="#E11D48"/>
  <!-- A revert arrow: change everything for one week, then it goes back.
       That "and then it reverts" is what makes Free Hit different from a
       Wildcard, so it's the thing worth drawing. -->
  <path d="M32 17 A15 15 0 1 1 17 32" fill="none" stroke="#ffffff"
        stroke-width="6.5" stroke-linecap="round"/>
  <path d="M17 18.5 L25 31.5 L9 31.5 Z" fill="#ffffff"/>
</svg>
