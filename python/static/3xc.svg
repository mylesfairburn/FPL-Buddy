<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Triple Captain">
  <title>Triple Captain</title>
  <rect width="64" height="64" rx="14" fill="#D97706"/>
  <!-- "C" for captain, drawn as an arc rather than set as text: an icon that
       depends on a font being available at render time is an icon that can
       render wrong. -->
  <path d="M41.2 17.8 A13 13 0 1 0 41.2 36.2" fill="none" stroke="#ffffff"
        stroke-width="7" stroke-linecap="round"/>
  <!-- Three bars underneath for the multiplier. Same reasoning - no numeral. -->
  <rect x="18.5" y="45" width="8" height="7" rx="2.5" fill="#ffffff"/>
  <rect x="28" y="45" width="8" height="7" rx="2.5" fill="#ffffff"/>
  <rect x="37.5" y="45" width="8" height="7" rx="2.5" fill="#ffffff"/>
</svg>
