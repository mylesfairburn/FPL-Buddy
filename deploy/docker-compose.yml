# The live stack, as it actually runs on the host.
#
# This file used to be a reference copy that had DRIFTED from the server: a
# different service name, no `networks`, a published port the real one doesn't
# have, and neither support container. That is not a cosmetic problem. Adding a
# variable here and assuming it reached production is exactly how five Discord
# webhooks ended up set in .env, named in a file nobody was using, and empty
# inside the container - with no error anywhere.
#
# So: keep this file identical to /root/apps/docker-compose.yml. If you change
# one, change the other in the same sitting.
#
# Deployed as `mylesf`, not root. Root login over SSH is disabled, so the copy
# is two steps rather than one: scp cannot elevate, and /root/apps is readable
# only by root.
#
#   scp deploy/docker-compose.yml mylesf@web-host:/tmp/docker-compose.yml
#   ssh mylesf@web-host 'sudo mv /tmp/docker-compose.yml /root/apps/ && \
#                        cd /root/apps && sudo docker compose up -d'
#
# `sudo docker` here despite mylesf being in the docker group: the group grants
# access to the daemon socket, not read access to the compose file and .env
# sitting under /root.
#
# That awkwardness is the stack living under /root at all, which predates there
# being a non-root user. Moving it to /srv/apps owned by mylesf would make both
# commands plain again and would match /srv/fpl-companion, where the volumes
# already live. Worth doing on its own, not folded into another change - the
# .env moves with it and a half-moved stack starts with no secrets.
#
# Secrets live in /root/apps/.env, never here. See env.example.

services:
  # The service KEY and the CONTAINER name are both `fpl-buddy`. Keep them that
  # way, and read the next paragraph before changing either.
  #
  # This key used to be `fpl-companion`, and renaming it took the site down for
  # an hour. The reason is not visible from here: Compose registers the SERVICE
  # name as a DNS alias on the `web` network, and the Cloudflare tunnel forwards
  # to that name. The tunnel's config lives in the Zero Trust dashboard - not in
  # this repo, not in .env, not in any file on the host - so nothing could be
  # grepped for it and nothing warned. The container stayed up and healthy
  # throughout; cloudflared simply had nowhere to send traffic, which surfaces
  # as a Cloudflare 502 and looks like the app has crashed.
  #
  # The name is therefore load-bearing in a place you cannot search:
  #
  #   dashboard -> Tunnels -> Configure -> Public Hostname -> Service:
  #       http://fpl-buddy:8000
  #
  # If it ever changes again, change the dashboard FIRST. A tunnel pointing at a
  # name that does not resolve yet just retries and reconnects on its own; a
  # container carrying a name the tunnel has never heard of is a hard 502.
  #
  # The host paths further down stay /srv/fpl-companion regardless - they hold
  # the live database and have nothing to do with either name.
  fpl-buddy:
    image: ghcr.io/mylesfairburn/fpl-buddy:latest
    # Pinned explicitly, which is worth one line. Without it Compose names the
    # container <project>-<service>-<n>, where <project> is the DIRECTORY the
    # stack lives in. Every cron job addresses this container by name, and the
    # failure mode when that name drifts is silent: `docker exec` against a
    # container that doesn't exist fails into a log nobody reads, and the only
    # symptom is that the nightly jobs quietly stop happening.
    container_name: fpl-buddy
    restart: unless-stopped
    networks: [web]
    # Watchtower runs with --label-enable, so ONLY containers carrying this
    # label are auto-updated. Without it this container is never upgraded and
    # a green build sits in ghcr.io forever.
    labels:
      - com.centurylinklabs.watchtower.enable=true
    # No `ports:`. Nothing needs to reach this from the host - cloudflared
    # connects over the `web` network below - and not publishing a port means
    # there is no listener on the host to reach at all.
    volumes:
      # The host paths stay /srv/fpl-companion after the rename to FPL Buddy,
      # deliberately. They hold the live database and every file the nightly
      # job has written; renaming them means stopping the container, moving
      # data, and editing this file, with a real chance of the app coming back
      # up pointing at an empty directory and looking like it works.
      #
      # SQLite must outlive the image. NOT /app/data - that would shadow the
      # CSVs baked into the image.
      - /srv/fpl-companion/state:/app/state
      # The data root has to outlive the image too. The nightly job writes
      # gameweek_stats.csv, the bootstrap cache and the per-player summaries
      # into it, and without this they were written into the image layer and
      # destroyed on every deploy - which silently dropped the app back to
      # preseason ratings until the next 03:00 run rebuilt them.
      #
      # Mounted at a NEW path, not over /app/data: that directory holds the
      # CSVs baked into the image, and mounting over it would hide them.
      - /srv/fpl-companion/data:/app/data-live
      # Read-only, and holding one file: the Google service-account JSON whose
      # path GSC_KEY points at. A file rather than an env var because that JSON
      # contains an RSA private key, and `docker inspect` prints environment
      # values in full to anyone who can talk to the Docker socket.
      - /srv/fpl-companion/secrets:/app/secrets:ro
    # EVERY variable the app reads has to be named here. One that .env sets and
    # this block omits never reaches the container, however carefully it is
    # written, and nothing reports it. That is not hypothetical - it has now
    # happened twice, to GSC_PROPERTY and to all five webhooks.
    environment:
      FPL_DB_PATH: /app/state/fpl_companion.db
      FPL_DATA_ROOT: /app/data-live
      FPL_REFRESH_TOKEN: ${FPL_REFRESH_TOKEN:?set this in /root/apps/.env}
      FPL_INDEXNOW_KEY: ${FPL_INDEXNOW_KEY:-}
      # 127.0.0.1 is correct despite there being no published port: the jobs run
      # INSIDE this container via `docker exec`, so loopback is the app itself.
      FPL_APP_URL: http://127.0.0.1:8000
      FPL_SOCIAL_KEY: ${FPL_SOCIAL_KEY:-}
      # Cloudflare Web Analytics site token. Not a secret - it is served in the
      # HTML of every page. Blank means no beacon is rendered and the CSP stays
      # entirely 'self', which is what a staging or local stack wants.
      FPL_CF_ANALYTICS_TOKEN: ${FPL_CF_ANALYTICS_TOKEN:-}
      # --- Discord channels --------------------------------------------------
      # Each falls back to FPL_ALERT_WEBHOOK when blank, so one variable puts
      # everything in one channel and they can be split out one at a time.
      FPL_ALERT_WEBHOOK: ${FPL_ALERT_WEBHOOK:-}
      FPL_DRAFTS_WEBHOOK: ${FPL_DRAFTS_WEBHOOK:-}
      FPL_GAMEWEEK_WEBHOOK: ${FPL_GAMEWEEK_WEBHOOK:-}
      FPL_SEO_WEBHOOK: ${FPL_SEO_WEBHOOK:-}
      # Questions typed into the box on /faq. Unlike the four above, this
      # channel IS the storage: /api/question writes nothing to the database
      # and records no address, so a question that fails to send is one nobody
      # ever sees. Falling back to the alerts channel is fine; leaving BOTH
      # blank means the form tells the reader it couldn't send.
      FPL_QUESTIONS_WEBHOOK: ${FPL_QUESTIONS_WEBHOOK:-}
      # Leave BLANK for Discord and Slack - their URLs are detected, and this
      # setting is ignored for them. It applies only to a receiver that is
      # neither (ntfy, a self-hosted endpoint), where "text" posts a plain body.
      FPL_ALERT_FORMAT: ${FPL_ALERT_FORMAT:-}
      # --- Ko-fi -------------------------------------------------------------
      # TOKEN is the secret Ko-fi sends to prove a delivery is really from them;
      # WEBHOOK is the Discord channel it gets relayed into. POST /api/kofi does
      # not exist at all unless the token is set.
      FPL_KOFI_WEBHOOK: ${FPL_KOFI_WEBHOOK:-}
      FPL_KOFI_TOKEN: ${FPL_KOFI_TOKEN:-}
      # --- Search Console / Bing reporting ------------------------------------
      GSC_KEY: ${GSC_KEY:-}
      BINGWEBMASTER_KEY: ${BINGWEBMASTER_KEY:-}
      PSI_KEY: ${PSI_KEY:-}
      # Has to be listed here as well as set in .env. The default it falls back
      # to inside the container is a URL-prefix property this site does not
      # have, so Search Console 403s and the nightly report is written with only
      # its Bing half filled in - and the job exits 0 by design on a partial
      # source failure, so nothing looks wrong.
      GSC_PROPERTY: ${GSC_PROPERTY:-}

  # The public front door. Terminates TLS at Cloudflare and reaches the app over
  # the `web` network, which is why the app publishes no port.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    networks: [web]

  # Pulls a new image when one is published and restarts the container.
  #
  # --label-enable means it only touches containers carrying the watchtower
  # label, so it will never restart cloudflared or itself. --interval 60 polls
  # once a minute, so a green build reaches the site in about that long.
  #
  # Not on the `web` network deliberately: it talks to the Docker socket, not to
  # the app, and there is no reason for it to be able to reach either.
  watchtower:
    image: nickfedor/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Read-only, and it is the GHCR credential - watchtower cannot pull a
      # private package without it.
      - /root/.docker/config.json:/config.json:ro
    command: --interval 60 --cleanup --label-enable

networks:
  web:
    driver: bridge
