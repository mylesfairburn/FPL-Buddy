services:
  fpl-buddy:
    image: ghcr.io/mylesfairburn/fpl-buddy:latest
    # Pinned explicitly, which is worth one line. Without it Compose names the
    # container <project>-<service>-<n>, where <project> is the DIRECTORY the
    # stack happens to live in - so the same file produced `apps-fpl-buddy-1`
    # in /root/apps and would produce something else if the directory were ever
    # renamed. Every cron job addresses this container by name, and the failure
    # mode when that name drifts is silent: `docker exec` against a container
    # that doesn't exist fails into a log nobody reads, and the only symptom is
    # that the nightly jobs quietly stop happening.
    container_name: fpl-buddy
    restart: unless-stopped
    # Bound to localhost: the reverse proxy terminates TLS and is the only
    # thing that should be able to reach /api/refresh from outside.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # The host paths stay /srv/fpl-companion after the rename to FPL Buddy,
      # deliberately. They hold the live database and every file the nightly
      # job has written; renaming them means stopping the container, moving
      # data, and editing this file, with a real chance of the app coming back
      # up pointing at an empty directory and looking like it works. A
      # directory name that reads slightly stale is a much smaller problem than
      # that, and it can be done later on its own - see deploy/README.md.
      #
      # SQLite must outlive the image. NOT /app/data - that would shadow the
      # CSVs baked into the image.
      - /srv/fpl-companion/state:/app/state
      # The data root has to outlive the image too. The nightly job writes
      # gameweek_stats.csv, the bootstrap cache and the per-player summaries
      # into it, and without this they were being written into the image layer
      # and destroyed on every deploy - which silently dropped the app back to
      # preseason ratings until the next 03:00 run rebuilt them.
      #
      # Mounted at a NEW path, not over /app/data: that directory holds the
      # CSVs baked into the image, and mounting over it would hide them.
      # ensure_seeded() copies /app/data into here on first boot, per-file and
      # missing-only, so a nightly-updated file is never reverted to the
      # image's stale copy.
      - /srv/fpl-companion/data:/app/data-live
      # Read-only, and holding one file: the Google service-account JSON whose
      # path GSC_KEY points at. A file rather than an env var because that JSON
      # contains an RSA private key, and `docker inspect` prints environment
      # values in full to anyone who can talk to the Docker socket. Read-only
      # because the app only ever reads it, so nothing that compromises the app
      # process can rewrite the credential.
      - /srv/fpl-companion/secrets:/app/secrets:ro
    environment:
      FPL_DB_PATH: /app/state/fpl_companion.db
      FPL_DATA_ROOT: /app/data-live
      # openssl rand -hex 32 > /srv/fpl-companion/refresh_token
      FPL_REFRESH_TOKEN: ${FPL_REFRESH_TOKEN:?set this, or /api/refresh stays open}
      FPL_APP_URL: http://127.0.0.1:8000
      # Serves /<key>.txt so IndexNow can verify ownership. Optional: unset,
      # the route doesn't exist and nothing else changes. Not a secret - the
      # whole point is that it's publicly readable - but it lives in .env with
      # the others so the compose file stays the same everywhere.
      FPL_INDEXNOW_KEY: ${FPL_INDEXNOW_KEY:-}
      # Lets the weekly social drafts be read from a phone, where a browser
      # can't send the X-Refresh-Token header the other route needs. The secret
      # IS the URL - see the note on FPL_SOCIAL_KEY in main.py for what that
      # trade costs. Unset, the route doesn't exist.
      #   openssl rand -hex 32
      FPL_SOCIAL_KEY: ${FPL_SOCIAL_KEY:-}
      # --- Alerting ----------------------------------------------------------
      # Where a failed or overdue scheduled job pushes a message. Optional:
      # unset, nothing is ever sent and nothing complains about it.
      #
      # This reaches the cron jobs as well as the web app - `docker exec`
      # inherits the container's environment, which is why no secret is passed
      # in /etc/cron.d/fpl-buddy.
      #
      # Named here for the same reason GSC_PROPERTY had to be: a variable this
      # block doesn't list never reaches the container however carefully it is
      # set in .env, and the failure is silent - alerting would simply never
      # fire, which is indistinguishable from nothing ever going wrong.
      FPL_ALERT_WEBHOOK: ${FPL_ALERT_WEBHOOK:-}
      # Three more channels, each falling back to FPL_ALERT_WEBHOOK when unset -
      # so one variable gets you everything in one channel, and splitting them
      # out later is one variable at a time.
      #
      #   drafts    post drafts as they become postable (the nightly player
      #             write-up, the briefing a day out, the roundup)
      #   gameweek  deadline reminders, and what the AI Manager did
      #   seo       the weekly Search Console digest
      #
      # Worth splitting: these want different notification settings. `alerts`
      # should buzz at 3am, `drafts` should be waiting in the morning, `seo` is
      # a weekly read. One channel carrying all four ends up muted.
      FPL_DRAFTS_WEBHOOK: ${FPL_DRAFTS_WEBHOOK:-}
      FPL_GAMEWEEK_WEBHOOK: ${FPL_GAMEWEEK_WEBHOOK:-}
      FPL_SEO_WEBHOOK: ${FPL_SEO_WEBHOOK:-}
      # Ko-fi donations, relayed into Discord by POST /api/kofi.
      #
      # Two variables doing two different jobs, and a third already above:
      #   FPL_KOFI_WEBHOOK  the DISCORD webhook this posts into
      #   FPL_KOFI_TOKEN    the secret Ko-fi sends, proving a delivery is real
      #   FPL_KOFI_HANDLE   the public name behind the site's donate button
      #
      # The route does not exist unless FPL_KOFI_TOKEN is set. That endpoint has
      # to be reachable by Ko-fi's servers, which cannot authenticate, so the
      # token in the payload is the only thing standing between it and anyone
      # who finds the URL.
      FPL_KOFI_WEBHOOK: ${FPL_KOFI_WEBHOOK:-}
      FPL_KOFI_TOKEN: ${FPL_KOFI_TOKEN:-}
      # Only needed if a URL isn't a Discord or Slack webhook and the
      # auto-detection guesses wrong: discord | slack | text
      FPL_ALERT_FORMAT: ${FPL_ALERT_FORMAT:-}
      # --- Search Console / Bing reporting -----------------------------------
      # Both optional: unset, the reporting job skips that source and says so
      # rather than failing.
      #
      # GSC_KEY is a PATH, not the key itself - it points into the read-only
      # secrets mount above. BINGWEBMASTER_KEY is a short opaque string, so it
      # is fine as an environment value.
      GSC_KEY: ${GSC_KEY:-}
      BINGWEBMASTER_KEY: ${BINGWEBMASTER_KEY:-}
      # GSC_PROPERTY has to be listed here as well as set in .env. A variable
      # this block doesn't name never reaches the container, no matter what the
      # .env says - and the default it falls back to inside the container is a
      # URL-prefix property this site doesn't have, so Search Console 403s and
      # the nightly report is written with only its Bing half filled in. There
      # is no error anywhere: the job exits 0 by design on a partial source
      # failure. See the note in env.example for the property strings.
      GSC_PROPERTY: ${GSC_PROPERTY:-}
      # Optional. Unset, the report skips Core Web Vitals and says so.
      PSI_KEY: ${PSI_KEY:-}
